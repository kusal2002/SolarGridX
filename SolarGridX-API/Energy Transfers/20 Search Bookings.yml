info:
  name: "20 Search and filter bookings - expect 200"
  type: http
  seq: 20
http:
  method: GET
  url: "{{baseUrl}}/api/bookings/search?search={{bookingSearch}}&status={{bookingStatus}}&stationId={{stationId}}&page=1&pageSize=20"
  auth:
    type: bearer
    token: "{{backofficeToken}}"
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
