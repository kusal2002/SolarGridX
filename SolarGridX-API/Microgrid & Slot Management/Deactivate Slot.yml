info:
  name: Deactivate Slot
  type: http
  seq: 1
http:
  method: PATCH
  url: '{{baseUrl}}/api/slots/{{slotId}}/deactivate'
  auth:
    type: bearer
    token: '{{backofficeToken}}'
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
