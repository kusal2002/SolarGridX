info:
  name: Create slots
  type: http
  seq: 2
http:
  method: POST
  url: '{{baseUrl}}/api/slots'
  auth:
    type: bearer
    token: '{{backofficeToken}}'
  body:
    type: json
    data: |-
      {
        "stationId": "{{stationId}}",
        "slotDate": "{{slotDate}}",
        "startTime": "09:00:00",
        "endTime": "11:00:00",
        "energyCapacityKwh": 50
      }
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
