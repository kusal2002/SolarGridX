info:
  name: "Update Station"
  type: http
  seq: 22
http:
  method: PUT
  url: "{{baseUrl}}/api/stations/{{stationId}}"
  body:
    type: json
    data: |-
      {
        "stationName": "Test Solar Station",
        "location": "Colombo",
        "latitude": 6.9271,
        "longitude": 79.8612,
        "totalCapacityKwh": 100,
        "operatingStartTime": "08:00:00",
        "operatingEndTime": "18:00:00",
        "isActive": true
      }
  auth:
    type: bearer
    token: "{{backofficeToken}}"
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
