info:
  name: Login
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:5084/api/auth/login
  body:
    type: json
    data: |-
      {
        "email": "{{activeEmail}}",
        "password": "{{activePassword}}"
      }
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
