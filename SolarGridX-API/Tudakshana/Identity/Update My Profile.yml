info:
  name: Update My Profile
  type: http
  seq: 4

http:
  method: PUT
  url: http://localhost:5084/api/auth/users/{{prosumerNic}}/profile
  body:
    type: json
    data: |-
      {
        "name": "Updated Prosumer",
        "email": "{{activeEmail}}"
      }
  auth:
    type: bearer
    token: "{{jwtToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
