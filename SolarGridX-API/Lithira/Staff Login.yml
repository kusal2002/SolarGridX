info:
  name: Staff (Backoffice) Login
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{backofficeEmail}}",
        "password": "{{backofficePassword}}"
      }
  auth: none

script:
  post-response: |-
    if (res.status === 200 && res.body && res.body.token) {
      bru.setEnvVar("backofficeToken", res.body.token);
      console.log("Backoffice token saved successfully");
    }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
