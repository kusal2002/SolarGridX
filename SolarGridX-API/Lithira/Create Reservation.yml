info:
  name: Create Reservation
  type: http
  seq: 4

http:
  method: POST
  url: http://192.168.0.122:5000/api/reservation
  body:
    type: json
    data: |-
      {
        "prosumerNIC": "{{prosumerNic}}",
        "slotId": "{{slotId}}",
        "requestedEnergyKwh": 15.0
      }
  auth:
    type: bearer
    token: "{{prosumerToken}}"

script:
  post-response: |-
    if ((res.status === 200 || res.status === 201) && res.body && res.body.id) {
      bru.setEnvVar("reservationId", res.body.id);
      bru.setVar("reservationId", res.body.id);
      console.log("Auto-selected reservationId:", res.body.id);
    }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
