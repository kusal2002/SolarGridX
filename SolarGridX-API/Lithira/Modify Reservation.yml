info:
  name: Modify Reservation
  type: http
  seq: 7

http:
  method: PUT
  url: "{{baseUrl}}/api/reservation/{{reservationId}}"
  body:
    type: json
    data: |-
      {
        "requestedEnergyKwh": 20.0
      }
  auth:
    type: bearer
    token: "{{prosumerToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
